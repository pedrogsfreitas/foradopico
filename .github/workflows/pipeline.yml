name: pipeline

# Roda a cada push e a cada pull request. Qualquer etapa de segurança que
# falhar barra o pipeline antes de a imagem ser publicada.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  testes:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Testes da API
        working-directory: api
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build do front
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  gitleaks:
    name: Gitleaks (segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o Gitleaks analisa todo o histórico
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Análise estática
        # --severity ERROR: só achados graves barram o pipeline; os demais aparecem no log.
        run: semgrep scan --config p/default --severity ERROR --error --metrics=off

  imagem:
    name: Imagem e Trivy
    runs-on: ubuntu-latest
    needs: [testes, gitleaks, semgrep]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy na configuração (Dockerfile, compose e Terraform)
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" config /src \
            --severity HIGH,CRITICAL --exit-code 1

      - name: Build da imagem
        run: |
          docker build \
            --build-arg APP_VERSION="${GITHUB_SHA::7}" \
            -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .

      - name: Trivy na imagem (vulnerabilidades)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image "$IMAGE:${GITHUB_SHA::7}" \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: Teste de fumaça do container
        run: |
          docker run -d --name app -p 8000:8000 --read-only --tmpfs /tmp "$IMAGE:${GITHUB_SHA::7}"
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          test "$(docker exec app id -u)" != "0"

      - name: Publicar imagem no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"

  # deploy: entra aqui depois da escolha da nuvem (Terraform em infra/).
