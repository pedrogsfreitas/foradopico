# Sobe o MVP e a observabilidade:
#   docker compose up --build
# App:        http://localhost:8000
# Prometheus: http://localhost:9090   (só na máquina local)
# Grafana:    http://localhost:3000   (só na máquina local)

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: foradopico:${APP_VERSION:-local}
    ports:
      - "8000:8000"
    environment:
      # Sem valor, o grupo de endpoints correspondente responde 503 (fechado por padrão).
      ROBOT_API_KEY: ${ROBOT_API_KEY:-}
      SENSOR_API_KEY: ${SENSOR_API_KEY:-}
      HR_ACCESS_CODE: ${HR_ACCESS_CODE:-}
      LLM_API_URL: ${LLM_API_URL:-}
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?defina GRAFANA_ADMIN_USER no .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/foradopico.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  app-data:
  prometheus-data:
  grafana-data:
